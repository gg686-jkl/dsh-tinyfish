<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <text x="80" y="108" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="bold" fill="#f8fafc">dsh-tinyfish</text>
  <text x="80" y="166" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#94a3b8">Same <tspan font-family="DejaVu Sans Mono, monospace" fill="#e2e8f0">web_search</tspan> / <tspan font-family="DejaVu Sans Mono, monospace" fill="#e2e8f0">web_fetch</tspan> tools. Free backend.</text>

  <!-- before -->
  <rect x="80" y="220" width="520" height="250" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="112" y="268" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#f87171">MCP-only replacement</text>
  <text x="112" y="310" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#94a3b8">web_search</text>
  <text x="330" y="310" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#f87171">gone — schema changed</text>
  <text x="112" y="348" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#94a3b8">web_fetch</text>
  <text x="330" y="348" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#f87171">gone — schema changed</text>
  <text x="112" y="386" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#94a3b8">mcp__tinyfish__search</text>
  <text x="112" y="424" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#cbd5e1">the model has to learn a new tool</text>

  <!-- after -->
  <rect x="680" y="220" width="520" height="250" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="712" y="268" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="bold" fill="#4ade80">This project</text>
  <text x="712" y="310" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#e2e8f0">web_search</text>
  <text x="930" y="310" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4ade80">identical schema</text>
  <text x="712" y="348" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#e2e8f0">web_fetch</text>
  <text x="930" y="348" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#4ade80">identical schema</text>
  <text x="712" y="386" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#38bdf8">→ backend: TinyFish</text>
  <text x="712" y="424" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#cbd5e1">no MCP tools, no namespace prefix</text>

  <!-- arrow -->
  <path d="M612 345 H 668" stroke="url(#accent)" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="80" y="540" font-family="DejaVu Sans, sans-serif" font-size="24" fill="#94a3b8">
    DeepSeek Search &amp; Fetch: <tspan fill="#f8fafc">$0.75 / 1,000</tspan> each
    <tspan fill="#475569">   ·   </tspan>
    TinyFish: <tspan fill="#4ade80">free — 30 searches/min, 1,000 fetches/day</tspan>
  </text>
  <text x="80" y="590" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#64748b">github.com/gg686-jkl/dsh-tinyfish</text>
</svg>
