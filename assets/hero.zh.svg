<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131a2e"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <text x="80" y="108" font-family="DejaVu Sans, sans-serif" font-size="58" font-weight="bold" fill="#f8fafc">dsh-tinyfish</text>
  <text x="80" y="166" font-family="Noto Sans CJK SC, sans-serif" font-size="28" fill="#94a3b8">工具不变，后端换成免费的 TinyFish</text>

  <rect x="80" y="220" width="520" height="250" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="112" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#f87171">换成 MCP 工具</text>
  <text x="112" y="310" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#94a3b8">web_search</text>
  <text x="330" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#f87171">没了，schema 变了</text>
  <text x="112" y="348" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#94a3b8">web_fetch</text>
  <text x="330" y="348" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#f87171">没了，schema 变了</text>
  <text x="112" y="386" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#94a3b8">mcp__tinyfish__search</text>
  <text x="112" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#cbd5e1">模型得重新学一套工具</text>

  <rect x="680" y="220" width="520" height="250" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <text x="712" y="268" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="bold" fill="#4ade80">本项目</text>
  <text x="712" y="310" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#e2e8f0">web_search</text>
  <text x="930" y="310" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#4ade80">一模一样</text>
  <text x="712" y="348" font-family="DejaVu Sans Mono, monospace" font-size="19" fill="#e2e8f0">web_fetch</text>
  <text x="930" y="348" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#4ade80">一模一样</text>
  <text x="712" y="386" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#38bdf8">→ 后端：TinyFish API</text>
  <text x="712" y="424" font-family="Noto Sans CJK SC, sans-serif" font-size="19" fill="#cbd5e1">不挂 MCP，工具名没有前缀</text>

  <path d="M612 345 H 668" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)"/>

  <text x="80" y="540" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#94a3b8">
    DeepSeek：<tspan fill="#f8fafc">各 $0.75 / 1,000 次</tspan>
    <tspan fill="#475569">   ·   </tspan>
    TinyFish：<tspan fill="#4ade80">免费（30 次搜索/分，1,000 次抓取/天）</tspan>
  </text>
  <text x="80" y="590" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#64748b">github.com/gg686-jkl/dsh-tinyfish-mcp</text>
</svg>
